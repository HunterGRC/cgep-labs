name: grc-gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform/primitives/compliant-s3

jobs:
  grc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false

      - name: Install Conftest
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin conftest

      - name: Install tfsec
        run: |
          sudo curl -fsSL https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64 \
            -o /usr/local/bin/tfsec && sudo chmod +x /usr/local/bin/tfsec

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -out=tfplan -input=false -no-color \
            -var="project_name=cgep-lab" -var="environment=dev" | tee plan.txt
          terraform show -json tfplan > plan.json

      - name: Conftest policy gate
        id: conftest
        run: |
          mkdir -p evidence/lab-4-3
          EXIT=0
          {
            echo "["
            FI            FI            FI     iance.sc28_aws compliance.ac3_aws compliance.cm6_aws ; do
              [[ $FIRST -eq 1 ]] && FIRST=0 || printf ","
              set +e
              OUT=$(conftest test --policy               OUT=$(conftest test --policy          G_DIR/plan.json")
                                      set -e
              [[ $STATUS -eq 0 ]] || EXIT=1
              printf '%s' "$OUT"
            done
            echo
            echo "]"
          } > evidence/lab-4-3/conftest-results.json
          if           if           if           if           if echo "conftest:           if           if           ec scan
        id: tfsec
                                                                _DI                                                                _DI          "$TF_WORKING_DIR" --minimum-severity HIGH

      - name: Copy plan into evidence
        if: always()
        run: |
                                         ev               plan.json
                      ING_DIR"/plan.txt  evidence/lab-4-3/plan.txt

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-evidence-${{ github.run_id }}
          path: evidence/lab-4-3/
          retention-days: 90
