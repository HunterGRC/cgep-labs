name: grc-gate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  grc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.4'
      - name: Run Terraform Plan
        id: plan
        working-directory: terraform/primitives/compliant-s3
        run: |
          terraform init -input=false
          terraform plan -out=tfplan -no-color
          mkdir -p ../../evidence/lab-4-3
          terraform show -json tfplan > ../../evidence/lab-4-3/plan.json
      - name: Bundle + sign + upload to vault
        id: sign
        if: always()
        env:
          VAULT: ${{ vars.EVIDENCE_VAULT }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          BUNDLE="evidence-${RUN_ID}-${SHA}.tar.gz"
          ( cd evidence/lab-4-3 && tar czf "../../${BUNDLE}" . )
          sha256sum "${BUNDLE}" | awk '{print $1}' > "${BUNDLE}.sha256"
          cosign sign-blob --yes --bundle "${BUNDLE}.sig.bundle" "${BUNDLE}"
          KEY_PREFIX="runs/${RUN_ID}"
          aws s3 cp "${BUNDLE}" "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}"
          aws s3 cp "${BUNDLE}.sha256" "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}.sha256"
          aws s3 cp "${BUNDLE}.sig.bundle" "s3://${VAULT}/${KEY_PREFIX}/${BUNDLE}.sig.bundle"
          VID=$(aws s3api head-object --bucket "${VAULT}" --key "${KEY_PREFIX}/${BUNDLE}" --query VersionId --output text)
          printf '{"run_id":"%s","vault":"%s","bundle_key":"%s/%s","version_id":"%s","sha256":"%s","commit":"%s"}\n' \
            "$RUN_ID" "$VAULT" "$KEY_PREFIX" "$BUNDLE" "$VID" "$(cat ${BUNDLE}.sha256)" "$SHA" > receipt.json
          aws s3 cp receipt.json "s3://${VAULT}/${KEY_PREFIX}/receipt.json"
          mkdir -p evidence/lab-4-4
          cp receipt.json evidence/lab-4-4/receipt.json
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grc-evidence-${{ github.run_id }}
          path: |
            evidence/lab-4-3/
            evidence/lab-4-4/
          retention-days: 90
      - name: Enforce gate
        if: always()
        run: test "${{ steps.plan.outcome }}" = "success"
