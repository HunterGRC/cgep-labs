name: grc-gate
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
  pull-requests: write
env:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: terraform/primitives/compliant-s3
jobs:
  grc-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
          terraform_wrapper: false
      - name: Install Conftest and tfsec
        run: |
          curl -fsSL https://github.com/open-policy-agent/conftest/releases/download/v0.50.0/conftest_0.50.0_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin conftest
          sudo curl -fsSL https://github.com/aquasecurity/tfsec/releases/download/v1.28.14/tfsec-linux-amd64 -o /usr/local/bin/tfsec
          sudo chmod +x /usr/local/bin/tfsec
      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -out=tfplan -input=false -no-color -var="project_name=cgep-lab" -var="environment=dev" | tee plan.txt
          terraform show -json tfplan > plan.json
      - name: Conftest policy gate
        run: |
          mkdir -p evidence/lab-4-3
          EXIT=0
          {
            echo "["
            FIRST=1
            for ns in compliance.sc28_aws compliance.ac3_aws compliance.cm6_aws ; do
              [[ $FIRST -eq 1 ]] && FIRST=0 || printf ","
              set +e
              OUT=$(conftest test --policy policies --namespace "$ns" --output=json "$TF_WORKING_DIR/plan.json")
              STATUS=$?
              set -e
              [[ $STATUS -eq 0 ]] || EXIT=1
              printf '%s' "$OUT"
            done
            printf "\n]\n"
          } > evidence/lab-4-3/conftest-results.json
          [[ $EXIT -eq 0 ]]
      - name: tfsec scan and copy plan
        if: always()
        run: |
          tfsec "$TF_WORKING_DIR" --format sarif --out evidence/lab-4-3/tfsec.sarif || true
          cp "$TF_WORKING_DIR"/plan.json evidence/lab-4-3/plan.json
          cp "$TF_WORKING_DIR"/plan.txt  evidence/lab-4-3/plan.txt
          tfsec "$TF_WORKING_DIR" --minimu          tfsec "$TF_WORKING_DIpload evidence artifact
        if: always()
        uses: actions/uploa  artifact@v4
        with:
                       dence-${{ github.run_id }}
          path: evidence/lab-4-3/
          retention-days: 90
